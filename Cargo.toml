[workspace]
resolver = "2"
members = ["crates/eonsort-core", "crates/eonsort-cli", "src-tauri"]

[workspace.package]
version = "0.0.0-dev"
edition = "2021"
license = "MIT"
authors = ["Georg Nelles"]
repository = "https://github.com/it-atelier-gn/eonsort"

[workspace.dependencies]
eonsort-core = { path = "crates/eonsort-core" }
anyhow = "1"
blake3 = "1"
chrono = { version = "0.4", features = ["serde"] }
filetime = "0.2"
kamadak-exif = "0.6"
rayon = "1"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
walkdir = "2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[package]
name = "eonsort-cli"
description = "Command line interface for the eonsort file sorter"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "eonsort"
path = "src/main.rs"

[features]
default = ["download"]
download = ["eonsort-core/download"]

[dependencies]
eonsort-core.workspace = true
anyhow.workspace = true
clap = { version = "4", features = ["derive"] }
ctrlc = "3"
indicatif = "0.18"
serde_json.workspace = true

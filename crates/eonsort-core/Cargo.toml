[package]
name = "eonsort-core"
description = "Creation-date file sorting engine"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[features]
default = []
download = ["ureq/rustls"]
candle = ["dep:candle-core", "dep:candle-nn", "dep:candle-transformers"]
depth = ["candle", "download"]
upright = ["candle", "download"]
diffuse = ["candle", "download", "dep:tokenizers"]

[dependencies]
base64.workspace = true
candle-core = { workspace = true, optional = true }
candle-nn = { workspace = true, optional = true }
candle-transformers = { workspace = true, optional = true }
blake3.workspace = true
chrono.workspace = true
filetime.workspace = true
image.workspace = true
kamadak-exif.workspace = true
rayon.workspace = true
regex.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokenizers = { workspace = true, optional = true }
turbojpeg.workspace = true
ureq.workspace = true
walkdir.workspace = true

[dev-dependencies]
tempfile.workspace = true
